name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup
      - run: make check
      - run: make build
